site_name: RS Sales Scripts
site_description: السكريبتات الكاملة لفريق سيلز RS Financial Services — 8 ورش × 3 angles × 7 stages × 2 channels
site_author: Said Tantawy — Sales Director
copyright: "© RS Financial Services — Internal Use Only"

theme:
  name: material
  language: ar
  direction: rtl
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: تفعيل الوضع الداكن
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: تفعيل الوضع الفاتح
  font:
    text: Cairo
    code: JetBrains Mono

nav:
  # ───── 1. Daily Workflow ─────
  - 🏠 الرئيسية: index.md
  - 🧭 Decision Helper: helper/index.md
  - 🖨️ Cheatsheet (للطباعة): cheatsheet/index.md

  # ───── 2. Scripts (per workshop) ─────
  - 📚 سكريبتات الورش:
      - scripts/index.md
      - 📘 المحاسب المالي: scripts/financial-accountant/index.md
      - 📊 إعداد القوائم المالية: scripts/financial-statements/index.md
      - 📗 المحاسب الشامل: scripts/comprehensive-accountant/index.md
      - 📕 خبير الضرائب: scripts/tax-expert/index.md
      - 📙 Odoo Accounting: scripts/odoo/index.md
      - 📓 هندسة التكاليف: scripts/cost-engineering/index.md
      - 📔 التحليل المالي: scripts/financial-analysis/index.md
      - 📒 المدير المالي CFO: scripts/cfo/index.md
      - 🟢 ورشة الإكسيل: scripts/excel/index.md

  # ───── 3. Objections ─────
  - 🛡️ معالجة الاعتراضات:
      - objections/index.md
      - 💰 السعر + الخصم: objections/price.md
      - 🚧 Stalling — هفكر / هكلم زوجتي: objections/stalling.md
      - 🤔 الثقة + الضمان: objections/trust.md
      - ⏰ الوقت + المواعيد: objections/time.md
      - 📍 Logistics — مكان/Online/لاب توب: objections/logistics.md
      - 🥊 Competition — منافسين/يوتيوب: objections/competition.md
      - ❓ Doubt — شك في القيمة: objections/doubt.md

  # ───── 4. Pricing & Assets ─────
  - 💰 الأسعار + الباقات: pricing/index.md
  - 🤝 Multi-booking + Bundles: multi-booking/index.md
  - 📥 PDFs الورش: pdfs/index.md

  # ───── 5. Onboarding ─────
  - 🚀 ابدأ من هنا (للسيلز الجديد): start/index.md

  # ───── 6. Team & Operations (للـ Director + Team Leads) ─────
  - 👥 إدارة الفريق:
      - team/index.md
      - 📊 KPIs: team/kpis.md
      - 🤝 1-on-1 Template: team/1on1.md
      - 🎙️ صوت السيلز (Voice Guide): team/voice-guide.md
  - 📊 التقارير: reports/index.md
  - 🎓 التدريب + Role-Play: training/role-play.md
  - 🤝 Marketing Handoff: handoff/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.snippets

plugins:
  - search:
      lang:
        - ar
        - en

extra:
  social:
    - icon: fontawesome/brands/whatsapp
      link: https://wa.me/201024523258
      name: واتساب RS

extra_css:
  - assets/custom.css
  - assets/brief-triage.css

extra_javascript:
  - assets/noindex.js
  - assets/stage-nav.js
  - assets/brief-triage.js
